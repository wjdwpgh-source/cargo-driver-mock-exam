<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="가로로 뻗은 왕복 2차로 도로 아래쪽에 연회색 보도가 있고, 그 아래가 건물이다. 건물 주차장 출구에서 A가 위쪽 보도 쪽을 향해 있고 도로로 나가 오른쪽으로 꺾는 점선 화살표가 있다. 보도 왼쪽에서 보행자 B가 걸어오고, 도로 왼쪽에서 C가 오른쪽으로 달려온다." xmlns:c2pa="http://c2pa.org/manifest"><title>가로로 뻗은 왕복 2차로 도로 아래쪽에 연회색 보도가 있고, 그 아래가 건물이다. 건물 주차장 출구에서 A가 위쪽 보도 쪽을 향해 있고 도로로 나가 오른쪽으로 꺾는 점선 화살표가 있다. 보도 왼쪽에서 보행자 B가 걸어오고, 도로 왼쪽에서 C가 오른쪽으로 달려온다.</title><rect width="400" height="300" fill="#cfe8c4"/><rect x="0" y="116.0" width="400" height="68" fill="#6b7280"/><line x1="0" y1="150.0" x2="400" y2="150.0" stroke="#facc15" stroke-width="4"/><rect x="0" y="184" width="400" height="28" fill="#e5e7eb" opacity="1"/><rect x="0" y="212" width="400" height="88" fill="#9ca3af" opacity="1"/><rect x="225" y="212" width="60" height="88" fill="#6b7280" opacity="1"/><path d="M255,232 L258,180 L300,167 L360,167" fill="none" stroke="#1f5fbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polygon points="0,-12 9,4 -9,4" fill="#1f5fbf" transform="translate(360,167) rotate(90.0)"/><text x="20" y="260" font-size="15" font-weight="700" fill="#111827" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">건물</text><g transform="translate(172,200) scale(1.0)"><circle cx="0" cy="-14" r="5" fill="#111827"/><path d="M0,-9 L0,6 M0,6 L-6,18 M0,6 L6,18 M-7,-3 L7,-3" stroke="#111827" stroke-width="3.5" stroke-linecap="round" fill="none"/></g><text x="172" y="176.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111827" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">B</text><g transform="translate(80,167) rotate(90)"><rect x="-13.0" y="-22.0" width="26" height="44" rx="5" fill="#d6262d" stroke="#111827" stroke-width="1.5"/><rect x="-9.0" y="-17.0" width="18" height="9" rx="2" fill="#dbeafe"/><text x="0" y="5" font-size="16" font-weight="700" text-anchor="middle" fill="#fff" font-family="Malgun G