ple SD Gothic Neo, Noto Sans KR, sans-serif">어린이</text><g transform="translate(300,60) scale(0.22)"><polygon points="100,10 190,84 190,190 10,190 10,84" fill="#1f5fbf" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/><g transform="translate(100,104)"><g transform="translate(-14,-4)"><g transform="translate(0,0) scale(1.15)"><circle cx="0" cy="-30" r="9" fill="#ffffff"/><path d="M0,-20 L0,10 M0,10 L-12,34 M0,10 L12,34 M-14,-6 L14,-6" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/></g></g><g transform="translate(18,6) scale(0.72)"><g transform="translate(0,0) scale(1.0)"><circle cx="0" cy="-30" r="9" fill="#ffffff"/><path d="M0,-20 L0,10 M0,10 L-12,34 M0,10 L12,34 M-14,-6 L14,-6" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/></g></g><line x1="-2" y1="-8" x2="10" y2="-2" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(100,166)"><text x="0" y="0" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">어린이보호</text></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>