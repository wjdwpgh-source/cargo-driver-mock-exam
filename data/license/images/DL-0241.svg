<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="고속도로 편도 2차로와 오른쪽 갓길. 왼쪽 위에 &#x27;정체&#x27;라고 적혀 있다. 2차로 아래쪽에 파란색 A 차량이 있고, 앞쪽 2차로에 B, 1차로에 C와 D 차량이 멈춰 있다. 오른쪽 갓길에서 E 차량이 위쪽으로 달리고 있다." xmlns:c2pa="http://c2pa.org/manifest"><title>고속도로 편도 2차로와 오른쪽 갓길. 왼쪽 위에 &#x27;정체&#x27;라고 적혀 있다. 2차로 아래쪽에 파란색 A 차량이 있고, 앞쪽 2차로에 B, 1차로에 C와 D 차량이 멈춰 있다. 오른쪽 갓길에서 E 차량이 위쪽으로 달리고 있다.</title><rect width="400" height="300" fill="#cfe8c4"/><rect x="132.0" y="0" width="136" height="300" fill="#6b7280"/><line x1="200.0" y1="0" x2="200.0" y2="300" stroke="#facc15" stroke-width="4"/><line x1="166.0" y1="0" x2="166.0" y2="300" stroke="#ffffff" stroke-width="3" stroke-dasharray="18 14"/><line x1="234.0" y1="0" x2="234.0" y2="300" stroke="#ffffff" stroke-width="3" stroke-dasharray="18 14"/><rect x="268" y="0" width="34" height="300" fill="#9ca3af" opacity="1"/><text x="306" y="20" font-size="13" font-weight="700" fill="#111827" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">갓길</text><text x="8" y="24" font-size="15" font-weight="700" fill="#111827" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">정체</text><g transform="translate(251,255) rotate(0)"><rect x="-13.0" y="-22.0" width="26" height="44" rx="5" fill="#1f5fbf" stroke="#111827" stroke-width="1.5"/><rect x="-9.0" y="-17.0" width="18" height="9" rx="2" fill="#dbeafe"/><text x="0" y="5" font-size="16" font-weight="700" text-anchor="middle" fill="#fff" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" transform="rotate(-0.0)">A</text></g><g transform="translate(251,165) rotate(0)"><rect x="-13.0" y="-22.0" width="26" height="44" rx="5" fill="#d6262d" stroke="#111827" stroke-width="1.5"/><rect x="-9.0" y="-17.0" width="18" height="9" rx="2" fill="#dbeafe"/><text x="0" y="5" font-size="16" font-weight="700" text-anchor="middle" fill="#fff" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-seri